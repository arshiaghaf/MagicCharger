name: Release preparation
on:
  pull_request:
    paths:
      - .github/workflows/release-prep.yml
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - LICENSE
      - build-app.sh
      - VERSION
      - BUILD_NUMBER
      - assets/**
      - scripts/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify release test gate
        run: sh Tests/Packaging/check-release-gate.sh
      - name: Test and prepare exact-source release artifacts
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/prepare-release.sh
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: magic-charger-release-prep
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 7
